<!DOCTYPE html>
<html>
<head>
    <title>Edit Review</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">Edit Review</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Guest Name</label>

                <input type="text"
                       name="guest_name"
                       value="{{ review.guest_name }}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Rating</label>

                <select name="rating"
                        class="form-control">

                    <option value="5" {% if review.rating == 5 %}selected{% endif %}>★★★★★</option>
                    <option value="4" {% if review.rating == 4 %}selected{% endif %}>★★★★</option>
                    <option value="3" {% if review.rating == 3 %}selected{% endif %}>★★★</option>
                    <option value="2" {% if review.rating == 2 %}selected{% endif %}>★★</option>
                    <option value="1" {% if review.rating == 1 %}selected{% endif %}>★</option>

                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Review</label>

                <textarea name="comment"
                          class="form-control"
                          rows="5"
                          required>{{ review.comment }}</textarea>
            </div>

            <button type="submit"
                    class="btn btn-warning">
                Update Review
            </button>

            <a href="{% url 'review_list' %}"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
