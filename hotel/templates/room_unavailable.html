<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Unavailable - Aura Hotel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card border-0 shadow-lg">

                <div class="card-body text-center p-5">

                    <div class="mb-4">
                        <i class="fas fa-calendar-times text-danger"
                           style="font-size:70px;"></i>
                    </div>

                        <h1 class="fw-bold text-danger mb-3">
                            Room Unavailable
                        </h1>

                        <h5 class="text-muted mb-4">
                            Aura Hotel Nairobi
                        </h5>

                    <p class="lead text-muted">
                        Unfortunately, this room is already booked for the selected dates.
                    </p>

                    <p class="text-muted">
                        Please try different dates or choose another room type.
                    </p>

                    <div class="mt-4">

                        <a href="{% url 'reservation' %}"
                           class="btn btn-warning btn-lg me-2">

                            Try Different Dates

                        </a>

                        <a href="{% url 'rooms' %}"
                           class="btn btn-outline-secondary btn-lg me-2">

                            View Rooms

                        </a>

                        <a href="{% url 'home' %}"
                           class="btn btn-dark btn-lg">

                            Return Home

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</body>
</html>
