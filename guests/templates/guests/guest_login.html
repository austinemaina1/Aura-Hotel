{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Hotel | Guest Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:
        linear-gradient(
            rgba(0,0,0,.45),
            rgba(0,0,0,.45)
        ),
        url("/static/images/aurahotel.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-card{
    width:100%;
    max-width:450px;
    border:none;
    border-radius:20px;
    background:rgba(255,255,255,.95);
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.hotel-logo{
    width:60px;
    height:60px;
    border-radius:50%;
    object-fit:cover;
}

.form-control{
    height:45px;
}

.btn-login{
    height:45px;
    font-weight:600;
}

</style>

</head>
<body>
<div class="login-card">
<div class="card-body p-3">

    <div class="text-center mb-3">

        <img src="/static/images/aurahotel.png"
             class="hotel-logo">

        <h2 class="mt-3">
            Aura Hotel
        </h2>

        <p class="text-muted">
            Guest Login
        </p>

    </div>

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">

            <label class="form-label">
                Username
            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                required>

        </div>

        <button
            type="submit"
            class="btn btn-success w-100 btn-login">

            Login

        </button>

    </form>

    <div class="text-center mt-3">

        Don't have an account?

        <a href="{% url 'register_guest' %}">
            Register
        </a>

    </div>
</div>
</div>

</body>
</html>
