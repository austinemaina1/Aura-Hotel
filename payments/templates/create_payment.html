<!DOCTYPE html>
<html>
<head>
    <title>Record New Payment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">Record New Payment</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">
                    Reservation
                </label>
                {{ form.reservation }}
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Amount (KES)
                </label>
                {{ form.amount }}
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Payment Method
                </label>
                {{ form.payment_method }}
            </div>

            <div class="mb-3">
                <label class="form-label">
                     Status
                </label>
                {{ form.status }}
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Payment Date
                </label>
                {{ form.payment_date }}
            </div>

            <button type="submit"
                    class="btn btn-success">
                Save Payment
            </button>

            <a href="{% url 'payment_list' %}"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
