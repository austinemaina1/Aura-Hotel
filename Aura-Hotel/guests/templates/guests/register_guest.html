<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Hotel | Guest Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    height:100vh;
    margin:0;

    background:
        linear-gradient(
            rgba(0,0,0,0.55),
            rgba(0,0,0,0.55)
        ),
        url("/static/images/aurahotel.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.register-card{
    width:100%;
    max-width:550px;

    border:none;
    border-radius:25px;

    background:rgba(255,255,255,0.95);

    box-shadow:0 15px 40px rgba(0,0,0,.25);

    backdrop-filter:blur(8px);
}

.card-body{
    padding:25px !important;
}

.register-card h1{
    font-size:3rem;
    margin-bottom:5px;
}

.register-card p{
    margin-bottom:15px;
}

.mb-3{
    margin-bottom:10px !important;
}

label{
    font-size:1rem;
    margin-bottom:3px;
}

input{
    height:35px;
    padding:8px 12px;
}

.btn-primary{
    padding:12px;
    font-size:1.2rem;
}

.form-control{
    height:45px;
}

</style>
</head>
<body>

<div class="container py-3">

    <div class="card register-card mx-auto">

        <div class="card-body p-2 p-md-3">

<div class="text-center mb-3">

<img src="/static/images/aurahotel.png"
     alt="Aura Hotel"
     style="
        width:70px;
        height:70px;
        object-fit:cover;
        border-radius:50%;
        margin-bottom:10px;
     ">

    <h5 class="fw-bold mb-1">
        Aura Hotel
    </h5>

    <p class="text-muted">
        Guest Registration
    </p>

</div>



            <form method="POST">

                {% csrf_token %}

               <div class="mb-3">
    {{ form.username.label_tag }}
    {{ form.username }}
</div>

<div class="mb-3">
    {{ form.email.label_tag }}
    {{ form.email }}
</div>

<div class="mb-3">
    {{ form.password1.label_tag }}
    {{ form.password1 }}
</div>

<div class="mb-3">
    {{ form.password2.label_tag }}
    {{ form.password2 }}
</div>

                <button type="submit"
                        class="btn btn-success w-100">

                    Register

                </button>

            </form>

            <div class="text-center mt-4">

                Already have an account?

                <a href="{% url 'guest_login' %}"
                   class="text-decoration-none fw-bold">

                    Login

                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
