<!DOCTYPE html>
<html>
<head>
    <title>Guest Reviews</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2>Aura Hotel Guest Reviews</h2>

    <a href="{% url 'create_review' %}"
       class="btn btn-primary mb-3">
        Add Review
    </a>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Guest Name</th>
                <th>Rating</th>
                <th>Review</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

        {% for review in reviews %}

            <tr>

                <td>{{ review.id }}</td>

                <td>{{ review.guest_name }}</td>

                <td>
                    {{ review.rating }} ★
                </td>

                <td>{{ review.comment }}</td>

                <td>{{ review.created_at|date:"d M Y" }}</td>

                <td>

                    <a href="{% url 'edit_review' review.id %}"
                       class="btn btn-warning btn-sm">
                        Edit
                    </a>

                    <a href="{% url 'delete_review' review.id %}"
                       class="btn btn-danger btn-sm">
                        Delete
                    </a>

                </td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
