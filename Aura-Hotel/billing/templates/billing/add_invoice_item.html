<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Add Invoice Charge | Aura Hotel
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>

        body{
            background:#f5f7fb;
            margin:0;
        }

        .sidebar{
            width:260px;
            height:100vh;
            position:fixed;
            left:0;
            top:0;
            background:#1f2d3d;
            color:white;
            overflow-y:auto;
        }

        .sidebar .logo{
            width:80px;
            height:80px;
            object-fit:contain;
        }

        .sidebar .nav-link{
            color:white;
            padding:12px;
            border-radius:8px;
        }

        .sidebar .nav-link:hover{
            background:rgba(255,255,255,.1);
        }

        .main-content{
            margin-left:260px;
            padding:30px;
        }

        .top-bar{
            background:white;
            padding:20px;
            border-radius:15px;
            margin-bottom:25px;
            box-shadow:0 2px 10px rgba(0,0,0,.08);
        }

    </style>

</head>

<body>

    <!-- Sidebar -->

    <div class="sidebar p-3">

        <div class="text-center mb-4">

            <img src="/static/images/logo.png"
                 class="logo mb-2">

            <h4 class="text-white fw-bold">
                Aura Hotel
            </h4>

            <small class="text-light">
                Billing Center
            </small>

        </div>

        <hr class="text-light">

        <ul class="nav flex-column">

            <li class="nav-item mb-2">

                <a href="{% url 'billing_dashboard' %}"
                   class="nav-link text-warning">

                    <i class="bi bi-speedometer2"></i>
                    Dashboard

                </a>

            </li>

            <li class="nav-item mb-2">

                <a href="{% url 'audit_dashboard' %}"
                   class="nav-link">

                    <i class="bi bi-journal-text"></i>
                    Audit Center

                </a>

            </li>

            <li class="nav-item mb-2">

                <a href="{% url 'reservation_management' %}"
                   class="nav-link">

                    <i class="bi bi-calendar-check"></i>
                    Reservations

                </a>

            </li>

            <li class="nav-item mt-4">

                <a href="{% url 'logout' %}"
                   class="nav-link text-danger">

                    <i class="bi bi-box-arrow-right"></i>
                    Logout

                </a>

            </li>

        </ul>

    </div>

    <!-- Main Content -->

    <div class="main-content">

        <div class="top-bar">

            <h3 class="mb-1">
                Add Invoice Charge
            </h3>

            <small class="text-muted">
                Invoice #{{ invoice.id }}
            </small>

        </div>

        <div class="card shadow border-0">

            <div class="card-header bg-primary text-white">

                <h5 class="mb-0">

                    <i class="bi bi-plus-circle"></i>

                    New Charge

                </h5>

            </div>

            <div class="card-body">

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            Charge Type

                        </label>

                        {{ form.description }}

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            Quantity

                        </label>

                        {{ form.quantity }}

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-bold">

                            Unit Price (KSh)

                        </label>

                        {{ form.unit_price }}

                    </div>

                    <div class="d-flex justify-content-between">

                        <a href="{% url 'invoice_detail' invoice.id %}"
                           class="btn btn-secondary">

                            <i class="bi bi-arrow-left"></i>

                            Cancel

                        </a>

                        <button type="submit"
                                class="btn btn-success">

                            <i class="bi bi-check-circle"></i>

                            Save Charge

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
