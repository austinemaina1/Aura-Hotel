<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation Successful - Aura Hotel</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container text-center mt-5">

    <div class="card shadow p-5">

        <h1 class="text-success mb-4">
            Reservation Submitted Successfully!
        </h1>

        <p class="lead">
            Thank you for choosing Aura Hotel.
        </p>

        <p>
            We have received your reservation request and our team will contact you shortly to confirm your booking.
        </p>

        <a href="{% url 'guest_dashboard' %}"
           class="btn btn-primary btn-lg mt-3">
            Go To My Dashboard
        </a>

        <p class="text-muted mt-3">
            You will be redirected to your dashboard in 5 seconds...
        </p>

    </div>

</div>

<script>
setTimeout(function() {
    window.location.href = "{% url 'guest_dashboard' %}";
}, 5000);
</script>
</body>
</html>
